name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-and-emulation:
    name: ${{ matrix.os }} / ${{ matrix.precision }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        precision: [fp64, fp32]
    steps:
      - uses: actions/checkout@v5
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ runner.os }}-${{ matrix.precision }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Build public C++ library without development dependencies
        run: bazel build //:clqr --ignore_dev_dependency --config=${{ matrix.precision }}
      - name: Test CPU, Python, CUDA stub, and CUDA kernel emulation
        run: >-
          bazel test //...
          --config=${{ matrix.precision }}
          --test_output=errors
      - name: Build FP32 Metal JAX backend and run its source audit
        if: runner.os == 'macOS' && matrix.precision == 'fp32'
        # Hosted macOS runners do not guarantee an Apple-family GPU that can
        # execute Metal compute. Native validation therefore remains an
        # explicit local test; CI still builds it and audits its GPU path.
        run: |
          bazel build \
            //:_clqr_metal \
            //:jax_metal_binding_test \
            --config=fp32
          bazel test \
            //:jax_metal_fp64_test \
            //:jax_metal_source_audit_test \
            --config=fp32 \
            --test_output=errors
  sanitizers:
    name: ubuntu / ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan]
    steps:
      - uses: actions/checkout@v5
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ runner.os }}-${{ matrix.sanitizer }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Test C++ implementation and CUDA kernel emulation
        run: >-
          bazel test
          //:clqr_test
          //:cpu_dense_test
          //:adversarial_cpu_test
          //:workspace_allocation_test
          //:cpu_workspace_layout_test
          //:cuda_stub_test
          //:cuda_buffer_test
          //:cuda_kernel_emulation_test
          //benchmarks/reference:quadratic_factor_test
          //benchmarks/reference:stationarity_audit_test
          --config=fp64
          --config=${{ matrix.sanitizer }}
          --test_output=errors
